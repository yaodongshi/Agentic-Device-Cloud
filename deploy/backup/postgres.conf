# ADC WAL archive template (design/80 A-08, design/60 8.1, design/32 8.1).
#
# compose.yaml passes these four settings to postgres via explicit `-c` flags
# (see the postgres service `command` in compose.yaml — include_dir cannot be
# passed via -c) and mounts this file read-only at
# /etc/postgresql/adc-archive.conf as the reviewable source of truth. For
# non-compose installs, append the four lines to postgresql.conf directly.
#
# archive_timeout=300 forces a WAL segment switch every 5 minutes even when
# the system is idle, which bounds data loss to <= 5 minutes (RPO, NFR-001).
# wal_level=replica is required for any archive setup.
archive_mode = on
archive_command = 'mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f'
archive_timeout = 300
wal_level = replica
