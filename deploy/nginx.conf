# ADC 统一入口 nginx 配置（design/60 3.4）：
# /            -> 控制台 SPA（Vue 产物，history 路由回退）
# /v1,/v2,...  -> 统一 API 网关（唯一后端入口）
# WSS 升级（设备隧道）透传网关
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA history-mode fallback: unknown non-file paths serve the app shell.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Asset caching for hashed build outputs.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # API: everything goes through the unified gateway (never direct backends).
    location ~ ^/(v1|v2|healthz)(/|$) {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade for the device reverse tunnel (/v1/devices/tunnel).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
