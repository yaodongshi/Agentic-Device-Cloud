# Promtail config for ADC docker log shipping (design/60 6.2).
#
# Ships json-file logs of all adc containers to the loki service on adc-net.
# Enable the (commented) promtail service block in compose.yaml on Linux
# production hosts only: Docker Desktop (macOS/Windows) does not expose
# /var/lib/docker/containers inside containers, so promtail cannot read the
# log files there.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 30s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(adc-.+)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
