# ADC Prometheus scrape config (design/80 A-07, design/60 6.1/6.3).
#
# Runs inside the compose observability profile on the adc-net network and
# reaches targets by service name:
#   - gateway:9091 -> gateway /metrics (metrics listener is split from the
#     business port, B-09; host-mapped to 127.0.0.1:19091 only for host-side
#     debugging)
#   - adc:8080     -> data-plane /metrics (same port as the business API)
#
# Alert rules are seeded from alert-rules.yml next to this file; every rule
# must carry a runbook before it may stay (design/60 6.3).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "/etc/prometheus/alert-rules.yml"

scrape_configs:
  - job_name: gateway
    metrics_path: /metrics
    static_configs:
      - targets: ["gateway:9091"]
        labels:
          adc_component: gateway

  - job_name: adc
    metrics_path: /metrics
    static_configs:
      - targets: ["adc:8080"]
        labels:
          adc_component: data-plane
