# ADC 全栈 Compose（完全独立：项目名 adc、网络 adc-net、卷 adc_*、专用端口）
# 服务：gateway(唯一对外入口) / adc(Go 数据面单进程) / py-agent(Python Agent 面) / postgres / valkey
# 与用户机器上任何既有 Compose/容器互不干扰，绝不复用其网络与卷。
# 用法：docker compose -f deploy/compose.yaml up -d --build
name: adc

networks:
  adc-net:
    driver: bridge

volumes:
  adc_pg_data: {}
  adc_valkey_data: {}
  # Backup + WAL archive volume (design/60 8.1, design/80 A-08):
  # dumps and WAL segments land in /backup; ownership is fixed by
  # deploy/backup/backup.sh init-backup-dir.
  adc_backup: {}
  # Observability state (observability profile, design/80 A-07)
  adc_prom_data: {}
  adc_grafana_data: {}
  adc_loki_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: adc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ADC_PG_USER:-adc}
      POSTGRES_PASSWORD: ${ADC_PG_PASSWORD:-adc_dev_only}
      POSTGRES_DB: ${ADC_PG_DBNAME:-adc}
    # A-08: WAL archiving (RPO <= 5 min, design/60 8.1). The four -c values
    # mirror deploy/backup/postgres.conf (mounted read-only as reference);
    # include_dir cannot be passed via -c, so the flags are explicit.
    # Segments go to the adc_backup volume (/backup/wal). One-time ownership
    # fix: deploy/backup/backup.sh init-backup-dir
    command:
      - "postgres"
      - "-c"
      - "archive_mode=on"
      - "-c"
      - "archive_command=mkdir -p /backup/wal && test ! -f /backup/wal/%f && cp %p /backup/wal/%f"
      - "-c"
      - "archive_timeout=300"
      - "-c"
      - "wal_level=replica"
    volumes:
      - adc_pg_data:/var/lib/postgresql/data
      - ../ce/migrations:/docker-entrypoint-initdb.d:ro
      - adc_backup:/backup
      - ./backup/postgres.conf:/etc/postgresql/adc-archive.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [adc-net]

  # ---- Observability profile (design/80 A-07, design/60 ch. 6) ---------
  # Start: docker compose -f deploy/compose.yaml --profile observability up -d
  # All ports bind to loopback only; Grafana is the human entry point at
  # http://127.0.0.1:19300 (admin / ${GF_ADMIN_PASSWORD:-adc_dev_only}).
  prometheus:
    image: prom/prometheus:v3.2.1
    container_name: adc-prometheus
    restart: unless-stopped
    profiles: [observability]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # 30d retention, aligns with design/60 6.5 downsampling budget
      - --storage.tsdb.retention.time=30d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - adc_prom_data:/prometheus
    ports:
      - "127.0.0.1:19090:9090"
    networks: [adc-net]

  grafana:
    image: grafana/grafana:11.6.2
    container_name: adc-grafana
    restart: unless-stopped
    profiles: [observability]
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-adc_dev_only}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_ALLOW_ORG_CREATE: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - adc_grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:19300:3000"
    networks: [adc-net]

  loki:
    image: grafana/loki:3.4.3
    container_name: adc-loki
    restart: unless-stopped
    profiles: [observability]
    # local-config.yaml ships inside the image; state on the named volume
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - adc_loki_data:/loki
    ports:
      - "127.0.0.1:19310:3100"
    networks: [adc-net]

  # promtail (placeholder, commented out): ships docker json-file logs to
  # loki per design/60 6.2. Enable on Linux production hosts only — the
  # daemon paths below are not visible inside Docker Desktop (macOS/Windows),
  # keep it off on dev desktops. Config: deploy/promtail/promtail.yml.
  # promtail:
  #   image: grafana/promtail:3.4.3
  #   container_name: adc-promtail
  #   restart: unless-stopped
  #   profiles: [observability]
  #   command: -config.file=/etc/promtail/config.yml
  #   volumes:
  #     - ./promtail/promtail.yml:/etc/promtail/config.yml:ro
  #     - /var/lib/docker/containers:/var/lib/docker/containers:ro
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #   depends_on: [loki]
  #   networks: [adc-net]

  valkey:
    image: valkey/valkey:8-alpine
    container_name: adc-valkey
    restart: unless-stopped
    # SEC-06: ACL 落地——default 用户关闭，业务走专用 `adc` 用户
    #（规则见 deploy/valkey-acl.conf，密码须与 ADC_VALKEY_PASSWORD 同步）。
    # Valkey 8.x 的 aclfile 解析器不接受 # 注释，valkey-acl.conf 只能含 user 指令，
    # 说明性注释统一放在本文件。--requirepass 保留为兜底；TLS 端口为生产形态
    #（design/60 7.1），dev 默认关闭。
    command: ["valkey-server", "--requirepass", "${ADC_VALKEY_PASSWORD:-adc_dev_only}", "--aclfile", "/etc/valkey/acl.conf"]
    volumes:
      - adc_valkey_data:/data
      - ./valkey-acl.conf:/etc/valkey/acl.conf:ro
    healthcheck:
      # ACL 下健康检查必须显式携带用户（default 已关闭，无用户 AUTH 会失败）
      test: ["CMD-SHELL", "valkey-cli --user $${ADC_VALKEY_USERNAME:-adc} -a $${ADC_VALKEY_PASSWORD:-adc_dev_only} ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [adc-net]

  adc:
    build:
      context: ..
      dockerfile: Dockerfile.adc
    image: adc/ce:dev
    container_name: adc-app
    restart: unless-stopped
    command: ["-seed"]
    ports:
      - "127.0.0.1:18082:8080"
    environment:
      ADC_ENV: dev
      ADC_LOG_LEVEL: info
      ADC_HTTP_ADDR: ":8080"
      ADC_NODE_ID: adc-node-01
      ADC_DEVICE_KEK: ${ADC_DEVICE_KEK:-00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff}
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_USER: ${ADC_PG_USER:-adc}
      PG_PASSWORD: ${ADC_PG_PASSWORD:-adc_dev_only}
      PG_DBNAME: ${ADC_PG_DBNAME:-adc}
      PG_SSLMODE: disable
      VALKEY_ADDR: valkey:6379
      # SEC-06：ACL 用户名 + 密码须与 deploy/valkey-acl.conf 中的 adc 用户同步
      VALKEY_USERNAME: ${ADC_VALKEY_USERNAME:-adc}
      VALKEY_PASSWORD: ${ADC_VALKEY_PASSWORD:-adc_dev_only}
      # SEC-05：TLS 终结（证书注入，dev 默认关闭；生产经 secrets 挂载，design/60 7.1）
      ADC_TLS_ENABLE: ${ADC_TLS_ENABLE:-false}
      ADC_TLS_CERT: ${ADC_TLS_CERT:-}
      ADC_TLS_KEY: ${ADC_TLS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [adc-net]

  py-agent:
    build:
      context: ..
      dockerfile: Dockerfile.pyagent
    image: adc/py-agent:dev
    container_name: adc-py-agent
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:18081/healthz')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [adc-net]

  console:
    build:
      context: ..
      dockerfile: Dockerfile.console
    image: adc/console:dev
    container_name: adc-console
    restart: unless-stopped
    ports:
      - "18080:80"
    depends_on:
      gateway:
        condition: service_healthy
    networks: [adc-net]

  gateway:
    build:
      context: ..
      dockerfile: Dockerfile.adc
    image: adc/ce:dev
    container_name: adc-gateway
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/gateway"]
    environment:
      ADC_HTTP_ADDR: ":8080"
      ADC_BACKEND_ADMIN: "http://adc:8080"
      ADC_BACKEND_AGENTAPI: "http://adc:8080"
      ADC_BACKEND_CONNECTOR: "http://adc:8080"
      ADC_BACKEND_APPROVAL: "http://adc:8080"
      ADC_BACKEND_PYAGENT: "http://py-agent:18081"
      # SEC-05：TLS 终结（证书注入，dev 默认关闭；生产经 secrets 挂载，design/60 7.1）
      ADC_TLS_ENABLE: ${ADC_TLS_ENABLE:-false}
      ADC_TLS_CERT: ${ADC_TLS_CERT:-}
      ADC_TLS_KEY: ${ADC_TLS_KEY:-}
      # B-09：/metrics 独立内网监听（不暴露在业务入口端口上）
      ADC_METRICS_ADDR: ":9091"
    ports:
      # 业务端口不再对外：统一入口为 console(nginx) -> gateway
      # 指标抓取目标仅回环（内网），供宿主 Prometheus 采集
      - "127.0.0.1:19091:9091"
    depends_on:
      adc:
        condition: service_healthy
      py-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks: [adc-net]
