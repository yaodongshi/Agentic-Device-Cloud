# Valkey ACL rules (SEC-06), mounted read-only at /etc/valkey/acl.conf.
#
# Rules:
#   - `default` is OFF: unauthenticated and password-only (requirepass) clients
#     are rejected. The only working path is the named `adc` user below.
#   - `adc` is the application user for the single-process dev data plane:
#     all keys (~*), all pub/sub channels (&*), full command surface (+@all).
#     Production splits least-privilege per-service users (gateway/approval/
#     admin read/write roles, design/60 7.2/7.3) — the code already reads
#     VALKEY_USERNAME so no binary change is needed for the split.
#
# IMPORTANT: keep this password in sync with ADC_VALKEY_PASSWORD
# (deploy/.env.example, passed to the adc service as VALKEY_PASSWORD and to
# the `adc` AUTH user). If the password is rotated, regenerate this file;
# --requirepass on the server command line stays as the belt-and-braces
# fallback for the (disabled) default user.
user default off
user adc on >adc_dev_only ~* &* +@all
