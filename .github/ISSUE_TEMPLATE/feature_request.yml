name: Feature request
description: Propose a new feature or improvement
title: "feat: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea.

        Note the edition boundary: governance, compliance and scale features (RBAC/SSO, audit center, multi-level approval, cluster HA, metering) belong to the enterprise edition (ee/) and cannot be merged into ce/ via community PRs. If your idea touches that area, consider proposing a seam interface, hook or protocol improvement instead (see CONTRIBUTING.md).
  - type: checkboxes
    id: searched
    attributes:
      label: Search first
      options:
        - label: I searched existing issues and discussions; this has not been proposed
          required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem does this solve? Who has this problem?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe how you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Scope area
      options:
        - core-sdk (SDK / protocol)
        - ce/ platform
        - docs / examples
        - seam interface for enterprise extension
        - enterprise feature (EE boundary, discussion only)
    validations:
      required: true
  - type: textarea
    id: usecase
    attributes:
      label: Use case / industry context
      description: For example discrete manufacturing, CNC/PLC devices, the workflow this enables.
  - type: textarea
    id: context
    attributes:
      label: Additional context
