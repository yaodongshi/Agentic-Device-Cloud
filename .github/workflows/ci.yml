# ADC 主 CI 门禁（design/80 A-03/B2，design/60 5.1~5.2 门禁表，doc/06 6.3 CI 门禁）
#
# 触发：push dev 分支、全部 pull_request。
# 门禁链：
#   go     —— gofmt 零差异 → go vet → go test -race（覆盖率统计 + 门槛）
#   python —— uv lock --check → ruff check/format --check → pytest（core-sdk/python 与 ce/py-agent 双项目矩阵）
#   docker —— buildx 双架构（linux/amd64+linux/arm64）构建验证（A-04，不推送）
#             → syft SPDX SBOM 生成 → trivy 漏洞扫描（CRITICAL 阻断）
#
# console 前端门禁不在此文件：已有 .github/workflows/console-ci.yml
# （lint/typecheck/vitest/build/Playwright E2E，按 ce/console 路径触发），
# 本文件不再重复 console job，避免同一门禁双份执行。
#
# 待后续 OpenSpec 变更接入（A-03 增量，与 design/40 3.5 对齐）：
#   govulncheck（Go 依赖漏洞）、gitleaks（SEC-25 密钥扫描）、
#   许可证扫描 licensecheck/ScanCode（doc/06 6.3 白名单门禁）。
# 现未接入，接入前本流水线不等价于发布门禁全量。

name: ci

on:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read

jobs:
  release-source-gates:
    name: release source gates (i18n + SDK + migrations + version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            ce/go.mod
            core-sdk/go.mod
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: i18n gate
        run: node scripts/i18n-check.mjs --self-test
      - name: migration gate
        run: bash scripts/migration-check.sh
      - name: version gate
        run: bash scripts/version-check.sh v0.3.0
      - name: SDK matrix
        run: |
          python -m venv .venv
          .venv/bin/pip install -e core-sdk/python pytest
          bash scripts/sdk-matrix.sh

  go:
    name: go (gofmt + vet + test -race + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ADC_MIGRATION_TEST_DATABASE_URL: postgres://adc:adc@127.0.0.1:5432/adc_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: adc
          POSTGRES_PASSWORD: adc
          POSTGRES_DB: adc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adc -d adc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          # go.work 工作区：ce/ 与 core-sdk/ 两个模块共享依赖缓存
          cache-dependency-path: |
            ce/go.mod
            core-sdk/go.mod

      - name: gofmt 检查（零差异）
        run: |
          # 仅检查仓库跟踪的 .go 文件（ce/console/node_modules 内偶有第三方 Go 文件，不纳入）
          unformatted=$(git ls-files '*.go' | xargs -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt 未格式化的文件：" && echo "$unformatted" && exit 1
          fi
          echo "gofmt 检查通过"

      - name: go vet
        # go.work 工作区：从仓库根以模块前缀模式执行（根目录本身非模块）
        run: go vet ./ce/... ./core-sdk/...

      - name: go test -race + 覆盖率输出
        run: go test ./ce/... ./core-sdk/... -race -covermode=atomic -coverprofile=coverage.out

      - name: 覆盖率统计与门槛
        run: |
          go tool cover -func=coverage.out
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
          echo "实际总覆盖率：${TOTAL}%"
          # 覆盖率门槛（design/40：单测行覆盖不低于 70%；2026-08-15 实测 75.3% 已达标）
          THRESHOLD=70
          if awk "BEGIN{exit !(${TOTAL} >= ${THRESHOLD})}"; then
            echo "覆盖率 ${TOTAL}% 不低于门槛 ${THRESHOLD}%，通过"
          else
            echo "::error::覆盖率 ${TOTAL}% 低于门槛 ${THRESHOLD}%，阻断合并"
            exit 1
          fi

      - name: 上传覆盖率产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: go-coverage
          path: coverage.out
          retention-days: 7

  python:
    name: python (ruff + pytest + uv lock)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      ADC_MIGRATION_TEST_DATABASE_URL: postgres://adc:adc@127.0.0.1:5432/adc_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: adc
          POSTGRES_PASSWORD: adc
          POSTGRES_DB: adc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adc -d adc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      # 双项目矩阵（design/60 5.6）：core-sdk/python 契约实现 + ce/py-agent Agent 面
      matrix:
        project: [core-sdk/python, ce/py-agent]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"

      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5

      - name: uv 依赖锁定一致性（design/60 5.2：uv.lock 与 pyproject.toml 一致，离线可复现）
        run: uv lock --check

      - name: uv 安装依赖（--frozen 按 uv.lock 固化，含 dev 组）
        run: uv sync --frozen

      - name: ruff 静态检查（lint + format，零告警，design/40 PY-007）
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: 准备 Python Agent PostgreSQL schema
        if: matrix.project == 'ce/py-agent'
        run: |
          (cd ../.. && PG_HOST=127.0.0.1 PG_PORT=5432 PG_USER=adc PG_PASSWORD=adc PG_DBNAME=adc_test PG_SSLMODE=disable go run ./ce/cmd/adc-migrate)

      - name: pytest 单测
        env:
          # 显式 PYTHONPATH：保证 app/evals 等包在任意工作目录均可导入
          PYTHONPATH: ${{ github.workspace }}/${{ matrix.project }}
        run: uv run pytest -q

  docker:
    name: docker (buildx 双架构 + syft SBOM + trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: immutable-inputs
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: adc
            dockerfile: Dockerfile.adc
          - name: py-agent
            dockerfile: Dockerfile.pyagent
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: buildx 双架构构建验证（linux/amd64+linux/arm64，不推送，A-04）
        run: |
          # 双平台 manifest list 组装成功即验证 A-04 硬约束（design/60 5.2：缺任一架构阻断）。
          # 产物导出为 OCI layout tar，供 syft/trivy 本地扫描（CI 不推送镜像）。
          # arm64 经 QEMU 模拟构建；arm64 环境冒烟属 A-04 实测项，另行执行。
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -f ${{ matrix.dockerfile }} \
            -t adc-ci/${{ matrix.name }}:test \
            -o type=oci,dest=/tmp/${{ matrix.name }}.tar \
            .
          mkdir -p /tmp/${{ matrix.name }}-layout
          tar -C /tmp/${{ matrix.name }}-layout -xf /tmp/${{ matrix.name }}.tar

      - name: 安装 syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: syft SBOM 生成（SPDX，双平台）
        run: |
          for PLATFORM in linux/amd64 linux/arm64; do
            ARCH=${PLATFORM#linux/}
            syft scan "oci-dir:/tmp/${{ matrix.name }}-layout" --platform "$PLATFORM" \
              -o "spdx-json=sbom-${{ matrix.name }}-${ARCH}.spdx.json"
          done

      - name: 上传 SBOM 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sbom-${{ matrix.name }}
          path: sbom-${{ matrix.name }}-*.spdx.json
          retention-days: 30

      - name: 安装 trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: trivy 漏洞扫描（CRITICAL 阻断，双平台；design/60 5.2：CRITICAL 为 0）
        run: |
          for PLATFORM in linux/amd64 linux/arm64; do
            trivy image --input /tmp/${{ matrix.name }}-layout \
              --platform "$PLATFORM" \
              --severity CRITICAL --exit-code 1 --format table
          done

  immutable-inputs:
    name: immutable build inputs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: immutable reference gate
        run: |
          bash scripts/immutable-check-selftest.sh
          bash scripts/immutable-check.sh
          bash scripts/runtime-security-check.sh

  compose-smoke:
    name: real compose smoke
    needs: [immutable-inputs, go, python]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
      - name: runtime and Guard smoke
        env:
          ADC_COMPOSE_SMOKE_DESTRUCTIVE: "1"
        run: bash scripts/compose-smoke.sh
