# ADC 发布流水线（design/80 A-05，design/60 5.1~5.6，doc/06 6.3）
#
# tag vX.Y.Z 触发，链路：
#   全量源码门禁（Go/Python/Console/SDK/i18n/迁移/版本）
#   → 三镜像双架构构建并推送 commit SHA 暂存 tag（linux/amd64+linux/arm64）
#   → trivy CRITICAL 门禁（双平台）→ SPDX SBOM → 暂存 digest 签名
#   → 同一 digest 晋升正式 tag → GitHub Release（任一步失败清理本次正式 tag）
#
# 制品晋升铁律（design/60 5.5）：本流水线是唯一镜像构建入口，同一镜像摘要原样发布，
# 禁止在其他环境重新构建。
# 三仓联动（ADR-12）：ee/ 装配镜像依赖 ce/ 同 tag 镜像，ee 私有仓流水线须校验本 tag 已发布。
# 镜像命名跟随 github.repository（仓库迁移到 adc-io 组织后自动指向 ghcr.io/adc-io/*，design/60 2.7）。

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  source-gates:
    name: 发布前置源码门禁
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      ADC_MIGRATION_TEST_DATABASE_URL: postgres://adc:adc@127.0.0.1:5432/adc_test?sslmode=disable
    services:
      postgres:
        image: postgres:16-alpine@sha256:cf78e76683b9ca8c5733cbbdce6c9262b45b6767934dd0a95e671f9a0fc20685
        env:
          POSTGRES_USER: adc
          POSTGRES_PASSWORD: adc
          POSTGRES_DB: adc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U adc -d adc_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.x"
          cache-dependency-path: |
            ce/go.mod
            core-sdk/go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ce/console/package-lock.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          version: "0.8.13"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - name: 不可变构建输入门禁
        run: |
          bash scripts/immutable-check-selftest.sh
          bash scripts/immutable-check.sh
          bash scripts/runtime-security-check.sh
      - name: gofmt 门禁
        run: |
          unformatted=$(git ls-files '*.go' | xargs -r gofmt -l)
          test -z "$unformatted" || { printf 'gofmt 未格式化文件：\n%s\n' "$unformatted"; exit 1; }
      - name: Go vet、race 与覆盖率门禁
        run: |
          go vet ./ce/... ./core-sdk/...
          go test ./ce/... ./core-sdk/... -race -covermode=atomic -coverprofile=coverage.out
          TOTAL=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}' | tr -d '%')
          awk "BEGIN{exit !(${TOTAL} >= 70)}" || { echo "Go 覆盖率 ${TOTAL}% 低于 70%"; exit 1; }
      - name: Python lock、ruff 与 pytest 门禁
        run: |
          PG_HOST=127.0.0.1 PG_PORT=5432 PG_USER=adc PG_PASSWORD=adc PG_DBNAME=adc_test PG_SSLMODE=disable go run ./ce/cmd/adc-migrate
          for PROJECT in core-sdk/python ce/py-agent; do
            (cd "$PROJECT" && uv lock --check && uv sync --frozen && uv run ruff check . && uv run ruff format --check . && uv run pytest -q)
          done
      - name: Console 与 i18n 门禁
        working-directory: ce/console
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run lint
          npm run typecheck
          npm run i18n:test
          npm test
          npm run build
          npx playwright test
      - name: SDK、迁移与版本门禁
        run: |
          python -m venv .venv
          .venv/bin/pip install -e core-sdk/python pytest
          bash scripts/sdk-matrix.sh
          bash scripts/migration-check.sh
          bash scripts/version-check.sh "${GITHUB_REF_NAME}"
      - name: 真实 Compose runtime 与 Guard smoke
        env:
          ADC_COMPOSE_SMOKE_DESTRUCTIVE: "1"
        run: bash scripts/compose-smoke.sh

  release:
    needs: source-gates
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: 推导镜像仓库路径与版本号
        id: meta
        run: |
          # ghcr.io 路径必须全小写
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "image_base=${REGISTRY}/${REPO_LOWER}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: CHANGELOG 校验与候选说明提取
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          if ! grep -Fq "## [${VERSION}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 缺少 ## [${VERSION}] 条目（doc/06 6.3：每个 release 附 changelog）。"
            exit 1
          fi
          # 提取该版本条目作为 Release Notes（标题可带日期后缀，按行首前缀匹配；到下一个 ## [ 为止）
          awk -v target="## [${VERSION}]" '
            found && /^## \[/ {exit}
            index($0, target) == 1 {found=1; print; next}
            found {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 ce 暂存镜像（Go 数据面，双架构硬约束）
        id: build-ce
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.adc
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.image_base }}/ce:sha-${{ github.sha }}

      - name: 构建并推送 py-agent（Python Agent 面，双架构硬约束）
        id: build-py-agent
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.pyagent
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.image_base }}/py-agent:sha-${{ github.sha }}

      - name: 构建并推送 console（Vue 3 控制台，双架构硬约束）
        id: build-console
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Dockerfile.console
          platforms: linux/amd64,linux/arm64
          push: true
          sbom: true
          provenance: mode=max
          tags: |
            ${{ steps.meta.outputs.image_base }}/console:sha-${{ github.sha }}

      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: trivy 漏洞扫描（CRITICAL 阻断，双平台三镜像）
        run: |
          BASE="${{ steps.meta.outputs.image_base }}"
          TAG="sha-${{ github.sha }}"
          for IMAGE in ce py-agent console; do
            for PLATFORM in linux/amd64 linux/arm64; do
              trivy image --platform "$PLATFORM" \
                "${BASE}/${IMAGE}:${TAG}" \
                --severity CRITICAL --exit-code 1 --format table
            done
          done

      - name: 安装 syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: 生成 SPDX SBOM（随 Release 附件发布，doc/06 6.3：不生成 SBOM 不允许发版）
        run: |
          BASE="${{ steps.meta.outputs.image_base }}"
          TAG="sha-${{ github.sha }}"
          for IMAGE in ce py-agent console; do
            for PLATFORM in linux/amd64 linux/arm64; do
              ARCH=${PLATFORM#linux/}
              syft scan "registry:${BASE}/${IMAGE}:${TAG}" --platform "$PLATFORM" \
                -o "spdx-json=sbom-${IMAGE}-${ARCH}.spdx.json"
            done
          done

      - uses: sigstore/cosign-installer@1fc5bd396d372bee37d608f955b336615edf79c8 # v3.2.0

      - name: cosign keyless 签名三镜像 digest（design/60 5.2：未签名阻断发布）
        run: |
          BASE="${{ steps.meta.outputs.image_base }}"
          cosign sign --yes "${BASE}/ce@${{ steps.build-ce.outputs.digest }}"
          cosign sign --yes "${BASE}/py-agent@${{ steps.build-py-agent.outputs.digest }}"
          cosign sign --yes "${BASE}/console@${{ steps.build-console.outputs.digest }}"

      - uses: imjasonh/setup-crane@31b88efe9de28ae0ffa220711af4b60be9435f6e # v0.4

      - name: 安全门禁通过后晋升正式 tag 并创建 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE="${{ steps.meta.outputs.image_base }}"
          TAG="${{ steps.meta.outputs.version }}"
          RELEASE_TAG="${{ github.ref_name }}"
          declare -a PROMOTED=()

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "晋升失败，清理本次已创建的正式镜像 tag"
              for ref in "${PROMOTED[@]}"; do crane delete "$ref" || true; done
              gh release delete "$RELEASE_TAG" --yes || true
            fi
            exit "$status"
          }

          gh release view "$RELEASE_TAG" >/dev/null 2>&1 && { echo "Release $RELEASE_TAG 已存在，拒绝覆盖"; exit 1; }
          for IMAGE in ce py-agent console; do
            REF="${BASE}/${IMAGE}:${TAG}"
            if crane digest "$REF" >/dev/null 2>&1; then
              echo "正式镜像 tag 已存在，拒绝覆盖：$REF"
              exit 1
            fi
          done
          trap cleanup EXIT

          promote() {
            image="$1"
            digest="$2"
            ref="${BASE}/${image}:${TAG}"
            crane copy "${BASE}/${image}@${digest}" "$ref"
            PROMOTED+=("$ref")
            actual=$(crane digest "$ref")
            [ "$actual" = "$digest" ] || { echo "$ref 晋升后 digest 不一致"; return 1; }
          }
          promote ce "${{ steps.build-ce.outputs.digest }}"
          promote py-agent "${{ steps.build-py-agent.outputs.digest }}"
          promote console "${{ steps.build-console.outputs.digest }}"

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --notes-file /tmp/release-notes.md \
            sbom-*.spdx.json CHANGELOG.md
          trap - EXIT
