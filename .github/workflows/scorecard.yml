name: scorecard

# A3.3: OpenSSF Scorecard supply-chain security analysis (design/82 A3.3).
# Runs weekly (Saturday) and on every push to dev; the SARIF result is
# uploaded to GitHub code scanning so findings surface in the Security tab.
# Requires no secrets; the API badge becomes available once the repo is
# public and results are published by the action.

on:
  schedule:
    - cron: '30 1 * * 6'
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # SARIF upload to code scanning
      security-events: write
      # Publish results to the OpenSSF REST API (badge data)
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Scorecard needs full history for some checks (branch protection,
          # contributors); a shallow clone would silently weaken results.
          fetch-depth: 0

      - uses: ossf/scorecard-action@f49aabe0b5af0936a0987cfb85d86b75731b0186 # v2.4.1
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload results artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@42947a340483f03ba47bb1a039b2c519aab3df85 # v3
        with:
          sarif_file: results.sarif
