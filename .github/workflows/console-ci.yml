name: console-ci

# Frontend quality gates for ce/console (design/80 F-13): lint, typecheck,
# Vitest unit tests, production build and the Playwright E2E suite (F-12).
# E2E mocks the backend via page.route, so no services are needed.
on:
  push:
    branches: [dev]
    paths:
      - 'ce/console/**'
      - '.github/workflows/console-ci.yml'
  pull_request:
    paths:
      - 'ce/console/**'
      - '.github/workflows/console-ci.yml'

jobs:
  console:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ce/console
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ce/console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: i18n structure and terminology
        run: npm run i18n:test

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      - name: E2E tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            ce/console/playwright-report/
            ce/console/test-results/
          if-no-files-found: ignore
          retention-days: 7
