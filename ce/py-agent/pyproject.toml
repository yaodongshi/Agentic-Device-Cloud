[project]
name = "adc-py-agent"
version = "0.1.0"
description = "ADC Python agent plane: eval harness minimal set (V1.0)"
requires-python = ">=3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.34",
    "pydantic>=2.12,<3",
    "adc-core-sdk>=0.1.0",
    "redis>=8.1.0",
]

[project.scripts]
eval = "evals.cli:main"

[tool.uv.sources]
adc-core-sdk = { path = "../../core-sdk/python", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "ruff>=0.11",
    "mypy>=1.17",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "evals"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "evals", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
